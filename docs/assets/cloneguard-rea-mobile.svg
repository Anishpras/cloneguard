<svg xmlns="http://www.w3.org/2000/svg" width="480" height="730" viewBox="0 0 480 730" class="cg-demo" style="--cg-publish:65px, 39px;--cg-probe:-20px, 30px;--cg-public:48px, -43px" role="img" aria-labelledby="cg-mobile-title" aria-describedby="cg-mobile-desc">
  <title id="cg-mobile-title">CloneGuard and REA: reducing release exposure</title>
  <desc id="cg-mobile-desc">Illustrative workflow. CloneGuard finds a source map and environment file, keeps them in private storage, and stages JavaScript and HTML publicly. REA can read the public files but the removed source map is not shipped. A release receipt detects a later file modification. This does not demonstrate prevention of cloning.</desc>
  <style>
    .cg-bg{fill:#f8f9f6}.cg-panel{fill:#f8f9f6;stroke:#cdd6c7;stroke-width:1.4}.cg-owner{fill:#e5ecdf;stroke:#b6c7af;stroke-width:1.4}.cg-release{fill:#fff;stroke:#315b3c;stroke-width:1.8}.cg-chip{fill:#eff2ec;stroke:#d4ddcd}.cg-title,.cg-body,.cg-small,.cg-label{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#20251f}.cg-title{font-size:26px;font-weight:600;letter-spacing:-.6px}.cg-body{font-size:19px}.cg-small{font-size:16px;fill:#62695f}.cg-label{font-size:17px;fill:#315b3c;font-weight:600}.cg-code{font:16px 'SFMono-Regular',Consolas,monospace;fill:#315b3c}.cg-divider,.cg-wire{fill:none;stroke:#c3cdbd;stroke-width:1.5}.cg-wire{stroke-dasharray:5 6}.cg-packet rect{fill:#315b3c;stroke:#315b3c}.cg-packet text{fill:#fff;font:15px 'SFMono-Regular',Consolas,monospace}.cg-probe rect{fill:#62695f;stroke:#62695f}.cg-phase{opacity:0}.cg-phase-3{opacity:1}.cg-source-private{opacity:0}.cg-private-files{opacity:1}.cg-packet{opacity:0}.cg-phase-0{animation:cg-audit 16s step-end 1 both}.cg-phase-1{animation:cg-stage 16s step-end 1 both}.cg-phase-2{animation:cg-inspect 16s step-end 1 both}.cg-phase-3{animation:cg-verify 16s step-end 1 both}.cg-source-private{animation:cg-remove 16s ease-in-out 1 both}.cg-private-files{animation:cg-store 16s ease-in-out 1 both}.cg-publish{animation:cg-publish 16s ease-in-out 1 both}.cg-probe{animation:cg-probe 16s ease-in-out 1 both}.cg-public-code{animation:cg-public-code 16s ease-in-out 1 both}
    @keyframes cg-audit{0%,24.99%{opacity:1}25%,100%{opacity:0}}@keyframes cg-stage{0%,24.99%{opacity:0}25%,49.99%{opacity:1}50%,100%{opacity:0}}@keyframes cg-inspect{0%,49.99%{opacity:0}50%,74.99%{opacity:1}75%,100%{opacity:0}}@keyframes cg-verify{0%,74.99%{opacity:0}75%,100%{opacity:1}}
    @keyframes cg-remove{0%,25%{opacity:1;transform:translateY(0)}34%,100%{opacity:0;transform:translateY(35px)}}@keyframes cg-store{0%,26%{opacity:0;transform:translateY(-20px)}35%,100%{opacity:1;transform:translateY(0)}}
    @keyframes cg-publish{0%,34%{opacity:0;transform:translate(0,0)}37%{opacity:1;transform:translate(0,0)}46%{opacity:1;transform:translate(var(--cg-publish))}49%,100%{opacity:0;transform:translate(var(--cg-publish))}}
    @keyframes cg-probe{0%,50%{opacity:0;transform:translate(0,0)}53%{opacity:1;transform:translate(0,0)}60%,64%{opacity:1;transform:translate(var(--cg-probe))}71%{opacity:1;transform:translate(0,0)}74%,100%{opacity:0;transform:translate(0,0)}}
    @keyframes cg-public-code{0%,62%{opacity:0;transform:translate(0,0)}65%{opacity:1;transform:translate(0,0)}73%{opacity:1;transform:translate(var(--cg-public))}76%,100%{opacity:0;transform:translate(var(--cg-public))}}
    .cg-demo[data-paused='true'] *{animation-play-state:paused!important}.cg-demo[data-static-stage] *{animation:none!important}.cg-demo[data-static-stage] .cg-phase{opacity:0}.cg-demo[data-static-stage='0'] .cg-phase-0,.cg-demo[data-static-stage='1'] .cg-phase-1,.cg-demo[data-static-stage='2'] .cg-phase-2,.cg-demo[data-static-stage='3'] .cg-phase-3{opacity:1}.cg-demo[data-static-stage='0'] .cg-source-private{opacity:1}.cg-demo[data-static-stage='0'] .cg-private-files{opacity:0}
    @media(prefers-reduced-motion:reduce){.cg-demo *{animation:none!important}.cg-phase{opacity:0}.cg-phase-3{opacity:1}}
  </style>
  <rect x="0" y="0" width="480" height="730" rx="6" class="cg-bg"/>
  <path class="cg-wire" d="M115 256 C115 295 180 295 180 326 M365 256 C365 295 306 295 306 326 M115 256 V600 M240 556 V575 H365 V600"/>
  <rect x="16" y="28" width="198" height="228" rx="6" class="cg-owner"/>
  <text x="34" y="68" class="cg-title" text-anchor="start">CloneGuard</text>
  <text x="34" y="95" class="cg-small" text-anchor="start">Release workflow</text>
  <path d="M34 114 H196" class="cg-divider"/>
  <text x="34" y="147" class="cg-label" text-anchor="start">Audit, stage, verify</text>
  <g class=""><rect x="34" y="171" width="162" height="34" rx="6" class="cg-chip"/><text x="46" y="194" class="cg-code" text-anchor="start">app.js + HTML</text></g>
  <g class="cg-source-private"><rect x="34" y="217" width="162" height="34" rx="6" class="cg-chip"/><text x="46" y="240" class="cg-code" text-anchor="start">.map + .env</text></g>

  <rect x="266" y="28" width="198" height="228" rx="6" class="cg-panel"/>
  <text x="284" y="68" class="cg-title" text-anchor="start">REA</text>
  <text x="284" y="95" class="cg-small" text-anchor="start">Analysis agent</text>
  <path d="M284 114 H446" class="cg-divider"/>
  <text x="284" y="147" class="cg-label" text-anchor="start">Inspect public files</text>
  <text x="284" y="185" class="cg-body" text-anchor="start">Read the bundle</text>
  <text x="284" y="217" class="cg-body" text-anchor="start">Observe the UI</text>

  <rect x="130" y="326" width="220" height="230" rx="6" class="cg-release"/>
  <text x="240" y="364" class="cg-title" text-anchor="middle">Public release</text>
  <g class=""><rect x="148" y="387" width="184" height="34" rx="6" class="cg-chip"/><text x="160" y="410" class="cg-code" text-anchor="start">app.js</text></g>
  <g class=""><rect x="148" y="431" width="184" height="34" rx="6" class="cg-chip"/><text x="160" y="454" class="cg-code" text-anchor="start">index.html</text></g>
  <g class="cg-phase cg-phase-0"><text x="240" y="506" class="cg-label" text-anchor="middle">Inputs reviewed</text><text x="240" y="534" class="cg-small" text-anchor="middle">Original bytes retained.</text></g><g class="cg-phase cg-phase-1"><text x="240" y="506" class="cg-label" text-anchor="middle">Public files staged</text><text x="240" y="534" class="cg-small" text-anchor="middle">Original bytes retained.</text></g><g class="cg-phase cg-phase-2"><text x="240" y="506" class="cg-label" text-anchor="middle">Map not shipped</text><text x="240" y="534" class="cg-small" text-anchor="middle">Public code is readable.</text></g><g class="cg-phase cg-phase-3"><text x="240" y="506" class="cg-label" text-anchor="middle">File change detected</text><text x="240" y="534" class="cg-small" text-anchor="middle">Receipt comparison.</text></g>
  <rect x="16" y="600" width="198" height="96" rx="6" class="cg-owner"/>
  <text x="34" y="629" class="cg-label" text-anchor="start">Private storage</text>
  <g class="cg-private-files"><rect x="34" y="643" width="162" height="34" rx="6" class="cg-chip"/><text x="46" y="666" class="cg-code" text-anchor="start">.map + .env</text></g>
  <rect x="266" y="600" width="198" height="96" rx="6" class="cg-panel"/>
  <text x="284" y="629" class="cg-label" text-anchor="start">Release receipt</text>
  <g class="cg-phase cg-phase-0"><text x="284" y="659" class="cg-small" text-anchor="start">Prepare inventory</text></g>
  <g class="cg-phase cg-phase-1"><text x="284" y="659" class="cg-small" text-anchor="start">Hash staged files</text></g>
  <g class="cg-phase cg-phase-2"><text x="284" y="659" class="cg-small" text-anchor="start">Keep the receipt</text></g>
  <g class="cg-phase cg-phase-3"><text x="284" y="659" class="cg-body" text-anchor="start">Changed asset</text></g>
  <g class="cg-packet cg-publish"><rect x="79" y="258" width="82" height="30" rx="6" class="cg-panel"/><text x="120" y="279" class="" text-anchor="middle">app.js</text></g>
  <g class="cg-packet cg-probe"><rect x="294" y="270" width="76" height="30" rx="6" class="cg-panel"/><text x="332" y="291" class="" text-anchor="middle">.map?</text></g>
  <g class="cg-packet cg-public-code"><rect x="238" y="294" width="82" height="30" rx="6" class="cg-panel"/><text x="279" y="315" class="" text-anchor="middle">app.js</text></g>
  <g class="cg-phase cg-phase-0"><text x="240" y="715" class="cg-label" text-anchor="middle">Audit release inputs</text></g><g class="cg-phase cg-phase-1"><text x="240" y="715" class="cg-label" text-anchor="middle">Stage the public release</text></g><g class="cg-phase cg-phase-2"><text x="240" y="715" class="cg-label" text-anchor="middle">REA inspects public files</text></g><g class="cg-phase cg-phase-3"><text x="240" y="715" class="cg-label" text-anchor="middle">Verify the release receipt</text></g>
</svg>
